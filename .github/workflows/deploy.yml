name: Deploy website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/hello
            sudo cp /var/www/hello/index.html /var/www/hello/index.html.backup 2>/dev/null || true
            cd /tmp
            git clone https://github.com/subashvdr8838-hub/hello-subash.git deploy-hello || true
            sudo cp /tmp/deploy-hello/index.html /var/www/hello/index.html
            rm -rf /tmp/deploy-hello
